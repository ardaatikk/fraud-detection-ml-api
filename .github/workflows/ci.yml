name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest -v

  docker:
    name: Docker Build and Smoke Test
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t fraud-detection-api .

      - name: Start Docker container
        run: |
          docker run \
            --name fraud-detection-api \
            -d \
            -p 8000:8000 \
            fraud-detection-api

      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl --fail http://localhost:8000/health; then
              exit 0
            fi
            sleep 2
          done

          docker logs fraud-detection-api
          exit 1

      - name: Stop Docker container
        if: always()
        run: docker rm -f fraud-detection-api